# MobArmy collection caps: one mob type per line as MOB_TYPE: cap.
# cap is how many mobs of that type one team may collect per round; 0 disables the mob type.
# A mob type that is not listed here is uncapped. Names use Bukkit entity types, e.g. ZOMBIE_VILLAGER.
# The file is copied to plugins/KatzeGames/data once; updates only add new mob types and never change your lines.
# Changes are picked up when the next MobArmy round starts; a running round keeps its caps.

