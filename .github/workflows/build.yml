name: Build

on:
    push:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  java-version: '25'
                  distribution: 'temurin'
                  cache: gradle

            - name: Make Gradle executable
              run: chmod +x ./gradlew

            - name: Build
              run: ./gradlew :loader:shadowJar

            - name: Upload JAR
              uses: actions/upload-artifact@v4
              with:
                  name: MinecraftChallenges
                  path: loader/build/libs/MinecraftChallenges-*.jar
