name: Build

on:
    push:

permissions:
    contents: write

jobs:
    build:
        runs-on: windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  java-version: '25'
                  distribution: 'temurin'
                  cache: gradle

            - name: Build
              run: .\gradlew.bat :loader:shadowJar

            - name: Delete existing latest release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release delete latest --yes --cleanup-tag
              continue-on-error: true

            - name: Create latest release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create latest `
                    "loader/build/libs/MinecraftChallenges-*.jar" `
                    --title "MinecraftChallenges - Latest" `
                    --notes "Automatically built from commit ${{ github.sha }}" `
                    --target ${{ github.sha }}
